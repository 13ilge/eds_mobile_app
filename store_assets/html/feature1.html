<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1024, height=500, initial-scale=1">
<title>EDS Hız Asistanı - Öne Çıkan Görsel 1</title>
<style>
    html, body { margin: 0; padding: 0; overflow: hidden; }
    body {
      width: 1024px; height: 500px; margin: 0; overflow: hidden;
      font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
    }
    .scene {
      box-sizing: border-box;
      position: relative;
      width: 1024px; height: 500px;
      overflow: hidden;
      background: linear-gradient(100deg, #0B1220 0%, #1E3A8A 60%, #3B82F6 100%);
    }

    /* ---------- sağ taraf: perspektifli yol ---------- */
    .roadside {
      position: absolute; top: 0; right: 0;
      width: 520px; height: 500px;
      overflow: hidden;
      perspective: 900px;
      perspective-origin: 50% 44%;
    }
    .road {
      position: absolute;
      left: 50%; margin-left: -215px;
      width: 430px;
      top: 26px; height: 1000px;
      background: #0F172A;
      border-radius: 14px 14px 4px 4px;
      transform-origin: 50% 100%;
      transform: rotateX(66deg);
      box-shadow: 0 0 70px rgba(0,0,0,.65);
    }
    .edge {
      position: absolute; top: 0; bottom: 0; width: 9px;
      background: rgba(255,255,255,.30);
    }
    .edge.e1 { left: 24px; }
    .edge.e2 { right: 24px; }
    .dash {
      position: absolute; left: 50%; top: 0; bottom: 0;
      width: 18px; margin-left: -9px;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.92) 0px, rgba(255,255,255,.92) 44px,
        rgba(0,0,0,0) 44px, rgba(0,0,0,0) 104px);
    }
    .arc {
      position: absolute;
      border: 4px solid #F59E0B;
      border-radius: 50%;
      clip-path: inset(0 0 50% 0);
    }
    .a1 { width: 300px; height: 300px; left: 118px; top: 178px; opacity: .80; }
    .a2 { width: 440px; height: 440px; left: 48px;  top: 108px; opacity: .50; }
    .a3 { width: 580px; height: 580px; left: -22px; top: 38px;  opacity: .30; }

    /* ---------- sol taraf: metin ---------- */
    .left {
      position: absolute; left: 64px; top: 0;
      width: 520px; height: 500px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: flex-start;
      z-index: 3;
    }
    .pill {
      display: inline-block;
      padding: 8px 20px;
      background: rgba(59,130,246,.28);
      border: 2px solid rgba(255,255,255,.30);
      border-radius: 999px;
      font-size: 20px; line-height: 1; font-weight: 700;
      letter-spacing: 2px; white-space: nowrap;
    }
    h1 {
      margin: 18px 0 0;
      font-size: 88px; line-height: 1.05; font-weight: 800;
      letter-spacing: -2px;
    }
    .tag {
      margin: 14px 0 0;
      font-size: 22px; line-height: 1.4; font-weight: 500;
      color: rgba(255,255,255,.85);
      white-space: nowrap;
    }
</style>
</head>
<body>
  <div class="scene">
    <div class="roadside">
      <div class="road">
        <div class="edge e1"></div>
        <div class="edge e2"></div>
        <div class="dash"></div>
      </div>
      <div class="arc a1"></div>
      <div class="arc a2"></div>
      <div class="arc a3"></div>
    </div>

    <div class="left">
      <span class="pill">EDS RADAR ASİSTANI</span>
      <h1>EDS Hız<br>Asistanı</h1>
      <p class="tag">Sesli uyarı • Sürüş puanı • Topluluk</p>
    </div>
  </div>
</body>
</html>
