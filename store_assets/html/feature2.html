<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1024, height=500, initial-scale=1">
<title>EDS Hız Asistanı - Öne Çıkan Görsel 2</title>
<style>
    html, body { margin: 0; padding: 0; overflow: hidden; }
    body {
      width: 1024px; height: 500px; margin: 0; overflow: hidden;
      font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
    }
    .scene {
      box-sizing: border-box;
      position: relative;
      width: 1024px; height: 500px;
      overflow: hidden;
      background: linear-gradient(100deg, #0B1220 0%, #1E3A8A 60%, #3B82F6 100%);
    }

    /* ---------- dekoratif halkalar ---------- */
    .ring { position: absolute; border-radius: 50%; border: 2px solid rgba(255,255,255,.10); }
    .rg1 { width: 720px; height: 720px; right: -160px; top: -230px; }
    .rg2 { width: 900px; height: 900px; right: -250px; top: -320px; border-color: rgba(255,255,255,.07); }

    /* ---------- sağ taraf: hız kadranı ---------- */
    .gaugewrap {
      position: absolute; right: 70px; top: 70px;
      width: 360px; height: 360px;
    }
    .gauge {
      box-sizing: border-box;
      width: 360px; height: 360px;
      border: 26px solid rgba(255,255,255,.96);
      border-bottom-color: transparent;
      border-radius: 50%;
      box-shadow: 0 24px 60px rgba(0,0,0,.35);
    }
    .needle {
      position: absolute;
      left: 50%; bottom: 50%;
      width: 26px; height: 150px;
      margin-left: -13px;
      background: #F59E0B;
      border-radius: 20px;
      transform-origin: 50% 100%;
      transform: rotate(35deg);
      box-shadow: 0 8px 20px rgba(0,0,0,.35);
    }
    .hub {
      position: absolute;
      left: 50%; top: 50%;
      width: 52px; height: 52px;
      margin: -26px 0 0 -26px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 8px 20px rgba(0,0,0,.30);
    }
    .tick {
      position: absolute;
      left: 50%; top: 50%;
      margin-left: -4px; margin-top: -150px;
      width: 8px; height: 26px;
      background: rgba(255,255,255,.55);
      border-radius: 4px;
      transform-origin: 4px 150px;
    }
    .t1 { transform: rotate(-100deg); }
    .t2 { transform: rotate(-50deg); }
    .t3 { transform: rotate(0deg); }
    .t4 { transform: rotate(50deg); }
    .t5 { transform: rotate(100deg); }

    /* ---------- sol taraf: metin ---------- */
    .left {
      position: absolute; left: 64px; top: 0;
      width: 520px; height: 500px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: flex-start;
      z-index: 3;
    }
    .pill {
      display: inline-block;
      padding: 8px 20px;
      background: rgba(59,130,246,.28);
      border: 2px solid rgba(255,255,255,.30);
      border-radius: 999px;
      font-size: 20px; line-height: 1; font-weight: 700;
      letter-spacing: 2px; white-space: nowrap;
    }
    h1 {
      margin: 18px 0 0;
      font-size: 88px; line-height: 1.05; font-weight: 800;
      letter-spacing: -2px;
    }
    .foot {
      margin: 16px 0 0;
      display: flex; align-items: center; gap: 12px;
      font-size: 26px; line-height: 1.3; font-weight: 500;
      color: rgba(255,255,255,.90);
      white-space: nowrap;
    }
    .dot {
      width: 16px; height: 16px; border-radius: 50%;
      background: #10B981;
      box-shadow: 0 0 16px rgba(16,185,129,.7);
    }
</style>
</head>
<body>
  <div class="scene">
    <div class="ring rg1"></div>
    <div class="ring rg2"></div>

    <div class="gaugewrap">
      <div class="gauge"></div>
      <div class="tick t1"></div>
      <div class="tick t2"></div>
      <div class="tick t3"></div>
      <div class="tick t4"></div>
      <div class="tick t5"></div>
      <div class="needle"></div>
      <div class="hub"></div>
    </div>

    <div class="left">
      <span class="pill">EDS RADAR ASİSTANI</span>
      <h1>EDS Hız<br>Asistanı</h1>
      <div class="foot"><span class="dot"></span>Sürüş puanın yolda yükselsin.</div>
    </div>
  </div>
</body>
</html>
