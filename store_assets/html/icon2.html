<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=512, height=512, initial-scale=1">
<title>EDS Hız Asistanı - İkon 2</title>
<style>
    html, body { margin: 0; padding: 0; overflow: hidden; }
    body {
      position: relative;
      width: 512px; height: 512px; margin: 0; overflow: hidden;
      background: linear-gradient(160deg, #0B1220 0%, #1E3A8A 100%);
      font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
    }

    /* ---------- radar halkaları ---------- */
    .ring {
      position: absolute;
      border: 4px solid #F59E0B;
      border-radius: 50%;
      box-sizing: border-box;
    }
    .r1 { width: 190px; height: 190px; left: 161px; top: 161px; opacity: .90; }
    .r2 { width: 308px; height: 308px; left: 102px; top: 102px; opacity: .50; }
    .r3 { width: 420px; height: 420px; left: 46px;  top: 46px;  opacity: .25; }

    /* ---------- navigasyon oku ---------- */
    .arrow {
      position: absolute;
      left: 161px; top: 161px;
      width: 190px; height: 190px;
      background: #ffffff;
      clip-path: polygon(50% 0%, 100% 100%, 50% 76%, 0% 100%);
      transform: rotate(18deg);
      filter: drop-shadow(0 10px 22px rgba(0,0,0,.35));
    }

    /* ---------- hız çizgileri ---------- */
    .bar {
      position: absolute;
      height: 10px;
      background: rgba(255,255,255,.92);
      border-radius: 6px;
    }
    .b1 { right: 54px; bottom: 104px; width: 88px; }
    .b2 { right: 54px; bottom: 130px; width: 66px; }
    .b3 { right: 54px; bottom: 156px; width: 44px; }
</style>
</head>
<body>
  <div class="ring r3"></div>
  <div class="ring r2"></div>
  <div class="ring r1"></div>

  <div class="arrow"></div>

  <div class="bar b1"></div>
  <div class="bar b2"></div>
  <div class="bar b3"></div>
</body>
</html>
