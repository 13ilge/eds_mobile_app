<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=512, height=512, initial-scale=1">
<title>EDS Hız Asistanı - İkon 4</title>
<style>
    html, body { margin: 0; padding: 0; overflow: hidden; }
    body {
      position: relative;
      box-sizing: border-box;
      width: 512px; height: 512px; margin: 0; overflow: hidden;
      background: linear-gradient(160deg, #0B1220 0%, #1E3A8A 100%);
    }
    .scene {
      position: absolute; inset: 0;
      box-sizing: border-box;
      width: 512px; height: 512px;
      overflow: hidden;
    }

    /* ---------- stilize yol ---------- */
    .road {
      position: absolute;
      left: -28px; top: 186px;
      box-sizing: border-box;
      width: 568px; height: 140px;
      background: #E5E7EB;
      border-radius: 10px;
      transform: rotate(-4deg);
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
    }
    .lane {
      position: absolute;
      left: 0; top: 66px;
      box-sizing: border-box;
      width: 100%; height: 8px;
      border-radius: 4px;
      background: repeating-linear-gradient(to right,
        rgba(255,255,255,.95) 0px, rgba(255,255,255,.95) 28px,
        rgba(255,255,255,0) 28px, rgba(255,255,255,0) 60px);
    }

    /* ---------- radar dalga halkaları ---------- */
    .wave {
      position: absolute;
      box-sizing: border-box;
      border-radius: 50%;
    }
    .w1 { left: 181px; top: 181px; width: 150px; height: 150px; border: 6px solid #F59E0B; opacity: .80; }
    .w2 { left: 136px; top: 136px; width: 240px; height: 240px; border: 5px solid #FFFFFF; opacity: .40; }
    .w3 { left: 91px;  top: 91px;  width: 330px; height: 330px; border: 4px solid #F59E0B; opacity: .20; }

    /* ---------- nokta altı parlama ---------- */
    .glow {
      position: absolute;
      left: 106px; top: 250px;
      box-sizing: border-box;
      width: 300px; height: 120px;
      border-radius: 50%;
      background: radial-gradient(ellipse at 50% 40%, rgba(245,158,11,.55) 0%, rgba(245,158,11,0) 70%);
    }

    /* ---------- amber radar noktası ---------- */
    .dot {
      position: absolute;
      left: 221px; top: 221px;
      box-sizing: border-box;
      width: 70px; height: 70px;
      background: #F59E0B;
      border-radius: 50%;
      box-shadow: 0 10px 26px rgba(0,0,0,.45);
    }
    .bang {
      position: absolute;
      left: 31.5px; top: 15px;
      box-sizing: border-box;
      width: 7px; height: 24px;
      background: #FFFFFF;
      border-radius: 4px;
    }
    .bang-dot {
      position: absolute;
      left: 31.5px; top: 45px;
      box-sizing: border-box;
      width: 7px; height: 7px;
      background: #FFFFFF;
      border-radius: 50%;
    }

    /* ---------- hız çizgileri ---------- */
    .bar {
      position: absolute;
      height: 9px;
      background: rgba(255,255,255,.50);
      border-radius: 6px;
    }
    .b1 { right: 40px; top: 62px;  width: 96px; }
    .b2 { right: 40px; top: 88px;  width: 72px; }
    .b3 { right: 40px; top: 114px; width: 48px; }
</style>
</head>
<body>
  <div class="scene">
    <div class="road">
      <div class="lane"></div>
    </div>

    <div class="wave w3"></div>
    <div class="wave w2"></div>
    <div class="wave w1"></div>

    <div class="glow"></div>

    <div class="dot">
      <div class="bang"></div>
      <div class="bang-dot"></div>
    </div>

    <div class="bar b1"></div>
    <div class="bar b2"></div>
    <div class="bar b3"></div>
  </div>
</body>
</html>
